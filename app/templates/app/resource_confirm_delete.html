{% extends 'app/base.html' %}

{% block content %}
  <h1>Are you sure you want to delete this resource?</h1>
  <p>{{ resource.name }}</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
  </form>
  <a href="{% url 'resource_list' %}">Cancel</a>
{% endblock %}
