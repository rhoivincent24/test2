{% extends 'app/base.html' %}

{% block content %}
  <h1>All Resources</h1>
  <ul>
    {% for resource in resources %}
      <li>
        <a href="{% url 'resource_detail' resource.pk %}">{{ resource.name }}</a>
        <a href="{% url 'resource_update' resource.pk %}">Edit</a> | 
        <a href="{% url 'resource_delete' resource.pk %}">Delete</a>
      </li>
    {% endfor %}
  </ul>
  <a href="{% url 'resource_create' %}">Create New Resource</a>
{% endblock %}
