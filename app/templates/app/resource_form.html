{% extends 'app/base.html' %}

{% block content %}
  <h1>{% if form.instance.pk %}Update Resource{% else %}Create Resource{% endif %}</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if form.instance.pk %}Update{% else %}Create{% endif %} Resource</button>
  </form>
  <a href="{% url 'resource_list' %}">Cancel</a>
{% endblock %}
